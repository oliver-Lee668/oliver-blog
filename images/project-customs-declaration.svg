<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1229" viewBox="0 0 1536 1229">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c"/>
      <stop offset="50%" style="stop-color:#2d4373"/>
      <stop offset="100%" style="stop-color:#0f1b4d"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
